# Render Deployment Configuration
# For deploying the news pipeline as a cron job on Render

services:
  - type: cron
    name: news-pipeline
    env: python
    schedule: "0 8 * * *"  # Run daily at 8 AM UTC
    buildCommand: |
      pip install -r deployment/requirements.txt
      python -m playwright install chromium
    startCommand: python main.py
    
    # Environment variables
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: GNEWS_API_KEY
        sync: false  # Set this in Render dashboard
    
    # Resource allocation
    plan: starter  # Can upgrade to standard for more resources
    
  # Health checks are not applicable to cron services on Render
    
    # Build settings
    buildFilter:
      paths:
        - src/**
        - utils/**
        - main_functional.py
        - deployment/**