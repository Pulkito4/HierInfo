# Google Cloud Run Configuration
# For deploying as a scheduled Cloud Run job

apiVersion: run.googleapis.com/v1
kind: Service
metadata:
  name: news-pipeline
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/timeout: "3600s"  # 1 hour timeout
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
      - image: gcr.io/PROJECT_ID/news-pipeline:latest
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: GNEWS_API_KEY
          valueFrom:
            secretKeyRef:
              name: news-pipeline-secrets
              key: gnews-api-key

---
# Cloud Scheduler configuration for cron job
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: news-pipeline-schedule
spec:
  schedule: "0 8 * * *"  # Daily at 8 AM UTC
  timeZone: "UTC"
  httpTarget:
    uri: "https://news-pipeline-HASH-uc.a.run.app"
    httpMethod: POST
    headers:
      Authorization: "Bearer SERVICE_ACCOUNT_TOKEN"